# VWAP Pullback Bot — a separate bot instance from the main one.
#
# Port of the TradingView "Level Reversal v5" Pine strategy (tuned in the
# TradingView Strategy Tester): trade WITH the intraday trend when price
# pulls back to session VWAP, ADX confirming trend strength. Structure
# stop beyond the pullback, fixed 1.5R target, breakeven ratchet at +1R,
# lunch-chop and room-to-level filters, always flat by the close.
#
# Run alongside the main bot (each keeps its own database and history):
#   python run.py --config config-levels.yaml
#   python run.py --config config-levels.yaml --status

name: "VWAP Pullback Bot"

account:
  starting_equity: 100000.0
  currency: USD

timezone: America/New_York

broker:
  mode: alpaca_paper
  # NOTE: both bots share the same Alpaca paper account, so don't trade the
  # same tickers in both configs at once — each bot tracks its own positions.

reports:
  morning: "07:05"   # offset from the main bot so Telegram messages don't collide
  evening: "21:05"

risk:
  risk_per_trade_pct: 1.0
  atr_period: 14
  atr_stop_multiple: 2.0          # unused here: the strategy sets its own stop
  max_position_notional_pct: 100
  correlation_filter:
    group: [SPY, QQQ]
    max_same_direction: 2          # both indices may take the same setup

# Parameters mirror the Pine script inputs (tradingview/vwap_pullback_v5.pine).
instruments:
  - name: "S&P 500"
    ticker: "SPY"
    timeframe: "5m"
    strategy: vwap_pullback
    params: &vwap_params
      tolerance_pct: 0.05         # VWAP touch tolerance (%)
      stop_atr: 0.75              # stop beyond pullback (ATR mult)
      target_r: 1.5               # target as R multiple
      slope_bars: 3               # VWAP slope lookback
      adx_len: 14
      adx_min: 18                 # need a trend
      atr_len: 14
      vol_len: 20
      use_lunch_filter: true      # skip 11:30-13:30 chop
      use_room_filter: true       # don't buy into PDH / short into PDL
      use_breakeven: true         # stop to breakeven at +breakeven_r
      breakeven_r: 1.0            # R multiple that triggers the breakeven move
      trail_atr: 0.0              # >0 enables an ATR trailing stop; pair with
                                  # target_r: 0 to let winners run uncapped
      use_volume_filter: true     # above-average volume on signal bar
      trade_start: "09:45"
      trade_end: "15:30"
      lunch_start: "11:30"
      lunch_end: "13:30"
      flatten_at: "15:50"

  - name: "Nasdaq 100"
    ticker: "QQQ"
    timeframe: "5m"
    strategy: vwap_pullback
    params: *vwap_params

costs:
  per_side_bps: 2.0   # backtest transaction cost (commission + slippage),
                      # basis points of notional per side. ~2 bp ≈ SPY/QQQ
                      # spread plus a little slippage.

storage:
  db_path: "levelbot.db"
